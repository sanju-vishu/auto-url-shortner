name: AI Developer - Random Daily

on:
  # Python selects one pseudo-random half-hour slot per local calendar day.
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

concurrency:
  group: ai-developer-daily
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select today's randomized IST slot
        id: schedule
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/random_daily_slot.py

      - name: Record skipped slot
        if: steps.schedule.outputs.run != 'true'
        run: |
          echo "No AI changes scheduled for this half-hour slot." >> "$GITHUB_STEP_SUMMARY"
          echo "Today's selected time: ${{ steps.schedule.outputs.selected_time }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run AI developer
        id: claude
        if: steps.schedule.outputs.run == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: main
          branch_prefix: ai-developer/
          branch_name_template: "{{prefix}}daily-{{timestamp}}"
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 20
            --max-budget-usd 2
            --allowedTools "Read,Edit,Write,Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git fetch:*),Bash(git rebase:*),Bash(python:*),Bash(pip:*),Bash(pytest:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr:*),Bash(gh issue:*)"
          prompt: |
            You are the autonomous AI developer for sanju-vishu/auto-url-shortner.

            Implement one focused, high-priority item from ROADMAP.md, improve security,
            add tests, and fix bugs. Inspect the current code, recent commits, and open PRs first.

            SAFE GIT SYNCHRONIZATION:
            - Work only on a new ai-developer/* branch based on the latest main.
            - Before pushing, fetch origin and rebase the feature branch onto latest origin/main.
            - Integrate non-conflicting upstream changes through the rebase.
            - If conflicts occur, do not discard either side or resolve ambiguously. Stop the push
              and report the conflicting files; leave main untouched.
            - Never force-push, push application changes directly to main, or auto-merge a PR.
            - Avoid duplicating work already covered by an open PR.

            CODE AND SECURITY:
            - Preserve FastAPI/SQLAlchemy architecture unless a clear technical reason exists.
            - Add regression/unit/integration tests for each behavior change and bug fix.
            - Run pytest -q and relevant validation before committing.
            - Never read, print, copy, or commit secret values. Never commit .env files, tokens,
              passwords, private keys, credentials, or generated secrets.
            - Do not perform destructive database or infrastructure operations.
            - Keep changes focused and backward-compatible; update README for user-facing changes.
            - Review the final diff for secrets, accidental data exposure, and unrelated edits.

            Workflow:
            1. Read ROADMAP.md and select the highest-priority safe unchecked item.
            2. Inspect related code/tests, implement a small complete change, and add tests.
            3. Run pytest -q.
            4. Fetch origin/main and rebase the feature branch before pushing.
            5. If conflicts exist, stop and report them; never overwrite current files.
            6. Commit and push only the feature branch, then open a PR targeting main.
            7. Explain changes, tests, risks, conflicts, and follow-up steps in the PR.
            8. If no safe task can be completed, avoid an empty commit and report why.

      - name: Write run status log
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.claude.outcome }}
          SLOT: ${{ steps.schedule.outputs.selected_time }}
          SHOULD_RUN: ${{ steps.schedule.outputs.run }}
        run: |
          if [ "$SHOULD_RUN" != "true" ]; then STATUS="SKIPPED"; DETAILS="Today's selected random slot is $SLOT."
          elif [ "$STEP_OUTCOME" = "success" ]; then STATUS="SUCCESS"; DETAILS="AI developer action completed. Review its PR and workflow logs."
          elif [ "$STEP_OUTCOME" = "failure" ]; then STATUS="FAILED"; DETAILS="AI developer action failed or stopped. Review workflow logs."
          else STATUS="UNKNOWN"; DETAILS="No AI developer outcome was recorded."
          fi
          {
            echo "AI Developer automation status: $STATUS"
            echo "Repository: ${{ github.repository }}"
            echo "Details: $DETAILS"
            echo "Run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | tee automation-status.txt
          {
            echo "## Daily AI Developer status"
            echo ""
            echo "- **Status:** $STATUS"
            echo "- **Details:** $DETAILS"
            echo "- **Logs:** [Open workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Email deployment status (optional)
        if: always() && env.SMTP_SERVER != ''
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.NOTIFY_EMAIL_FROM }}
          TO_EMAIL: ${{ secrets.NOTIFY_EMAIL_TO }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ vars.SMTP_PORT || '587' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "AI Developer status: ${{ steps.claude.outcome || 'skipped' }} - ${{ github.repository }}"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          body: |
            Daily AI developer automation finished.
            Repository: ${{ github.repository }}
            AI step outcome: ${{ steps.claude.outcome || 'skipped' }}
            Run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload status log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: automation-status-${{ github.run_id }}
          path: automation-status.txt
          if-no-files-found: ignore
          retention-days: 30
